services:
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    networks:
      - default

  # https://hub.docker.com/_/redis
  redis:
    image: redis:8.6.2-alpine
    restart: always
    networks:
      - default
  
  app:
    image: nextcloud:stable
    container_name: nextcloud
    restart: always
    ports:
      - ${EXT_PORT}:80
    volumes:
      - nextcloud:/var/www/html
      - ${NEXTCLOUD_DATA}:/var/www/html/data
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - NEXTCLOUD_ADMIN_PASSWORD
      - NEXTCLOUD_ADMIN_USER
      - NEXTCLOUD_TRUSTED_DOMAINS
    depends_on:
      - redis
      - db
    networks:
      - default
      - homepage-network

volumes:
  nextcloud:
  db:

networks:
  homepage-network:
    external: true


