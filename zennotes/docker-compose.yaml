services:
  zennotes:
    image: adibhanna/zennotes:latest
    container_name: zennotes-selfhosted
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "${EXT_PORT}:7878"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${ZENNOTES_VOLUME}/Vault:/Vault
      - ${ZENNOTES_VOLUME}/data:/data
    environment:
      ZENNOTES_BIND: 0.0.0.0:7878
      ZENNOTES_CONFIG_PATH: /data/server.json
      ZENNOTES_DEFAULT_VAULT_PATH: "/Vault"
      ZENNOTES_BROWSE_ROOTS: "/Vault"
      ZENNOTES_ALLOWED_ORIGINS: "*"
      ZENNOTES_TRUSTED_PROXIES: "172.16.0.1/12"
      ZENNOTES_AUTH_TOKEN: "${AUTH_TOKEN}"
      ZENNOTES_ALLOW_INSECURE_NOAUTH: 0
      ZENNOTES_BEHIND_TLS: 1
    networks:
      - default
      - homepage-network

networks:
  homepage-network:
    external: true
