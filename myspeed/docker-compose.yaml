services:
  myspeed:
    image: germannewsmaker/myspeed:latest
    container_name: myspeed
    restart: unless-stopped
    ports:
      - "${EXT_PORT}:5216"
    volumes:
      - ${MYSPEED_DATA_PATH}:/myspeed/data
    networks:
      - homepage-network

networks:
  homepage-network:
    external: true
